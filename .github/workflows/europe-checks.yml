name: Europe coverage checks
on:
  push:
    branches: [feat/europe-coverage]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: europe-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run acceptance
      - run: npm run build
      - name: Browser QA tools (isolated from product dependencies)
        run: |
          npm install --prefix "$RUNNER_TEMP/pipe-radar-qa" --no-package-lock --no-audit playwright@1.56.1
          node "$RUNNER_TEMP/pipe-radar-qa/node_modules/playwright/cli.js" install chromium --only-shell
      - name: Browser regression
        run: QA_PLAYWRIGHT="$RUNNER_TEMP/pipe-radar-qa/node_modules/playwright" node scripts/browser-europe.cjs
      - name: Read-only source smoke test
        run: node --import tsx scripts/probe-europe.ts
        timeout-minutes: 6
      - name: Source format diagnostics
        if: always()
        run: node --import tsx scripts/diagnose-europe.ts
        timeout-minutes: 2
      - name: Archive tested source
        if: always()
        run: git archive --format=tar.gz HEAD -o pipe-radar-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipe-radar-europe-review
          retention-days: 7
          path: |
            pipe-radar-source.tar.gz
            dist/
            review/
