name: Scan job offers

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipe-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scan
        env:
          NAV_FEED_TOKEN: ${{ secrets.NAV_FEED_TOKEN }}
      - name: Publish refreshed snapshot
        run: |
          if git diff --quiet -- data/jobs.json data/scan-state.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "pipe-radar-bot"
          git config user.email "pipe-radar-bot@users.noreply.github.com"
          git add data/jobs.json data/scan-state.json
          git commit -m "data: refresh job snapshot"
          git push
